name: OpenSource Pulse
description: Create a practical maintenance report from structured repository signals
author: turgay2106
branding:
  icon: activity
  color: blue
inputs:
  input:
    description: Path to a JSON file containing issues, pullRequests, and checks arrays
    required: false
    default: pulse-input.json
  output:
    description: Path for the generated Markdown report
    required: false
    default: pulse-report.md
runs:
  using: node20
  main: src/action.js
